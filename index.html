<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SNAKE · Arcade Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#dff3ec; --muted:#7ba598;
    --line:rgba(126,231,196,.14);
    --snake:#5ef0a8; --food:#ff7d5c;
    --panel:rgba(8,26,22,.62);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    font-family:"Space Grotesk",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
    background:
      radial-gradient(120% 90% at 50% -12%, #17463a 0%, transparent 55%),
      linear-gradient(180deg,#0c2721 0%, #081b16 55%, #06130f 100%);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:42px 42px; opacity:.35;
    -webkit-mask-image:radial-gradient(80% 70% at 50% 40%,#000,transparent 90%);
            mask-image:radial-gradient(80% 70% at 50% 40%,#000,transparent 90%);
  }

  .cabinet{ position:relative; z-index:1; width:min(94vw,960px) }

  /* top bar */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px }
  .brand{ display:flex; align-items:center; gap:12px }
  .logo{ width:34px; height:34px; border-radius:9px; position:relative;
    background:linear-gradient(150deg,#7fffc6,#2fbf85); box-shadow:0 0 18px -2px #35e0a0, inset 0 0 0 2px rgba(255,255,255,.25) }
  .logo::before{ content:""; position:absolute; left:6px; top:9px; width:22px; height:7px; border-radius:4px; background:#08130f }
  .logo::after{ content:""; position:absolute; right:5px; top:13px; width:6px; height:6px; border-radius:50%; background:#ff7d5c }
  .brand h1{ font-family:"Press Start 2P",monospace; font-size:15px; letter-spacing:.06em; margin:0; color:#eafff7; text-shadow:0 0 14px rgba(94,240,168,.35) }
  .brand small{ display:block; margin-top:6px; font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--muted) }

  .stats{ display:flex; gap:10px }
  .stat{ min-width:96px; padding:9px 14px; border-radius:13px; background:var(--panel);
    border:1px solid var(--line); box-shadow:inset 0 1px 0 rgba(255,255,255,.05) }
  .stat label{ display:block; font-size:9.5px; letter-spacing:.26em; text-transform:uppercase; color:var(--muted); margin-bottom:5px }
  .stat span{ font-family:"Press Start 2P",monospace; font-size:17px; color:#eafff7 }
  .stat.bump span{ animation:bump .3s ease }

  .iconbtn{ width:40px; height:40px; display:grid; place-items:center; border-radius:12px; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); color:#cfeee2; font-size:15px; transition:.2s }
  .iconbtn:hover{ border-color:rgba(94,240,168,.5); color:#fff; transform:translateY(-1px) }

  /* stage */
  .stage{ position:relative; width:min(100%,560px); margin-inline:auto; padding:13px; border-radius:22px;
    background:linear-gradient(180deg,rgba(14,42,35,.9),rgba(7,20,16,.92));
    border:1px solid var(--line);
    box-shadow:0 34px 70px -24px rgba(0,0,0,.8), inset 0 0 0 1px rgba(94,240,168,.06), 0 0 0 6px rgba(6,15,12,.35) }
  .stage::before{ content:""; position:absolute; left:16%; right:16%; top:-26px; height:52px; pointer-events:none;
    background:radial-gradient(60% 100% at 50% 100%,rgba(94,240,168,.35),transparent 70%) }

  .board-wrap{ position:relative; border-radius:12px; overflow:hidden; background:#071a15;
    box-shadow:inset 0 0 40px rgba(0,0,0,.6), inset 0 0 0 2px rgba(94,240,168,.1) }
  canvas{ display:block; width:100%; height:auto; image-rendering:pixelated }

  .scanlines{ position:absolute; inset:0; pointer-events:none; border-radius:12px; mix-blend-mode:multiply; opacity:.5;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px) }
  .scanlines::after{ content:""; position:absolute; inset:0; border-radius:12px;
    box-shadow:inset 0 0 60px rgba(0,0,0,.55), inset 0 0 0 2px rgba(94,240,168,.12) }

  /* overlay */
  .overlay{ position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:20px;
    background:radial-gradient(circle at 50% 45%,rgba(7,26,21,.55),rgba(5,15,12,.86)); backdrop-filter:blur(3px);
    transition:opacity .35s ease }
  .overlay.hidden{ opacity:0; pointer-events:none }
  .ov-inner{ display:flex; flex-direction:column; align-items:center; gap:14px; max-width:92% }
  .ov-kicker{ font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:#8fd6bd }
  .ov-title{ font-family:"Press Start 2P",monospace; font-size:clamp(20px,5.4vw,34px); line-height:1.35; margin:0; color:#eafff7; text-shadow:0 0 22px rgba(94,240,168,.4) }
  .ov-sub{ font-size:14px; color:#a9cfc2; max-width:34ch; margin:0; line-height:1.5 }
  .ov-score{ font-family:"Press Start 2P",monospace; font-size:15px; color:#ffcf7d; letter-spacing:.04em }
  .ov-hint{ font-size:12px; color:var(--muted); letter-spacing:.06em }

  .btn{ font-family:"Space Grotesk"; font-weight:700; letter-spacing:.05em; text-transform:uppercase; font-size:13px;
    padding:13px 24px; border-radius:12px; cursor:pointer; transition:.18s; border:1px solid transparent }
  .btn-primary{ color:#06231c; background:linear-gradient(180deg,#7fffc6,#35d99a); box-shadow:0 10px 24px -8px rgba(53,217,154,.7) }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 16px 30px -8px rgba(53,217,154,.85) }

  /* footer */
  .hints{ display:flex; flex-wrap:wrap; gap:18px; justify-content:center; align-items:center; margin-top:20px; color:var(--muted); font-size:12.5px }
  .hint{ display:inline-flex; align-items:center; gap:7px }
  kbd{ font-family:"Space Grotesk"; font-weight:600; font-size:11px; background:rgba(255,255,255,.06); border:1px solid var(--line);
    border-bottom-width:3px; border-radius:7px; padding:4px 8px; color:#dff3ec }

  .dpad{ display:none; grid-template-columns:repeat(3,60px); grid-auto-rows:56px; gap:9px; margin-top:22px; justify-content:center }
  .dbtn{ border-radius:15px; background:var(--panel); border:1px solid var(--line); color:#cfeee2; font-size:20px;
    display:grid; place-items:center; cursor:pointer; user-select:none; touch-action:none; transition:.1s }
  .dbtn:active{ transform:scale(.93); background:rgba(94,240,168,.22); color:#fff }
  .d-up{grid-column:2;grid-row:1} .d-left{grid-column:1;grid-row:2} .d-right{grid-column:3;grid-row:2} .d-down{grid-column:2;grid-row:3}

  @media (pointer:coarse){ .dpad{display:grid} }
  @media (max-width:560px){
    body{padding:14px}
    .topbar{flex-wrap:wrap}
    .stats{order:3; width:100%; justify-content:center}
    .stat{min-width:82px; padding:8px 12px}
  }

  /* error banner (only shows if something goes wrong) */
  #err{ position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:99; max-width:90vw;
    background:#2a0d0d; color:#ffb4b4; border:1px solid #ff6b6b; border-radius:10px; padding:10px 14px;
    font-family:monospace; font-size:13px; display:none }

  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.28);color:#ffcf7d}100%{transform:scale(1)}}
</style>
</head>
<body>
  <div id="err"></div>
  <main class="cabinet">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <div><h1>SNAKE</h1><small>arcade terminal</small></div>
      </div>
      <div class="stats">
        <div class="stat"><label>Score</label><span id="score">0</span></div>
        <div class="stat"><label>Best</label><span id="best">0</span></div>
        <div class="stat"><label>Speed</label><span id="speed">1×</span></div>
      </div>
      <button id="mute" class="iconbtn" aria-label="Toggle sound">🔊</button>
    </header>

    <section class="stage">
      <div class="board-wrap">
        <canvas id="game"></canvas>
        <div class="scanlines" aria-hidden="true"></div>
        <div class="overlay" id="overlay"></div>
      </div>
    </section>

    <footer class="hints">
      <span class="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / arrows move</span>
      <span class="hint"><kbd>Space</kbd> pause</span>
      <span class="hint">swipe or D-pad on touch</span>
    </footer>

    <div class="dpad" id="dpad" aria-hidden="true">
      <button class="dbtn d-up" data-dir="up" aria-label="Up">▲</button>
      <button class="dbtn d-left" data-dir="left" aria-label="Left">◀</button>
      <button class="dbtn d-right" data-dir="right" aria-label="Right">▶</button>
      <button class="dbtn d-down" data-dir="down" aria-label="Down">▼</button>
    </div>
  </main>

<script>
(() => {
  "use strict";
  const errBox = document.getElementById('err');
  function fail(msg){ if(errBox){ errBox.style.display='block'; errBox.textContent='⚠ ' + msg; } console.error(msg); }
  window.addEventListener('error', e => fail(e.message || String(e)));

  try {
    const COLS = 21, ROWS = 21;
    const BASE_INTERVAL = 140, MIN_INTERVAL = 80, STEP = 2;

    // ---- state (initialized up front so the first draw never sees undefined) ----
    let snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    let dir = {x:1,y:0};
    let food = {x:14,y:10};
    let score = 0, best = 0, eaten = 0;
    let interval = BASE_INTERVAL, speedMult = '1';
    let running=false, paused=false, over=false, started=false;
    let prevHead=null, lastStep=0;
    let particles=[], flash=0, foodPulse=0;
    let inputQueue = [];

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const elScore=document.getElementById('score'), elBest=document.getElementById('best'), elSpeed=document.getElementById('speed');
    const muteBtn=document.getElementById('mute'), dpad=document.getElementById('dpad');

    let cell=20, boardSize=420;
    function resize(){
      const avail = Math.min(window.innerWidth-48, 560);
      cell = Math.max(12, Math.floor(avail/COLS));
      boardSize = cell*COLS;
      canvas.width  = Math.round(boardSize * devicePixelRatio);
      canvas.height = Math.round(boardSize * devicePixelRatio);
      ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    }
    window.addEventListener('resize', resize);

    // ---- audio ----
    let actx=null, muted=false;
    function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); }
    function tone(freq,dur,type='square',vol=.12,slideTo=null){
      if(!actx||muted) return;
      const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.setValueAtTime(freq,t);
      if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02);
    }
    const sfx={
      eat(){ tone(520,.09,'square',.14,760); },
      die(){ [320,240,170,110].forEach((f,i)=>setTimeout(()=>tone(f,.22,'sawtooth',.16,f*.6),i*80)); },
      start(){ tone(440,.08,'square',.1); setTimeout(()=>tone(660,.1,'square',.1),90); }
    };

    // ---- logic ----
    function freeCells(){ const occ=new Set(snake.map(s=>s.x+','+s.y)); occ.add(food.x+','+food.y);
      const a=[]; for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const k=x+','+y; if(!occ.has(k))a.push({x,y});} return a; }
    function placeFood(){ const c=freeCells(); food = c.length?c[(Math.random()*c.length)|0]:{x:-1,y:-1}; }

function reset(){ snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}]; dir={x:1,y:0};
  inputQueue=[]; score=0; eaten=0; interval=BASE_INTERVAL; speedMult='1'; prevHead=null; particles=[]; placeFood(); updateStats(); }

    function start(){ ensureAudio(); sfx.start(); reset(); running=true; paused=false; over=false; started=true; hideOverlay(); lastStep=performance.now(); }
    function pauseGame(){ if(!running||over) return; paused=true; showOverlay('pause'); }
    function resumeGame(){ if(over) return; paused=false; hideOverlay(); lastStep=performance.now(); }

    function step(){
      prevHead = {x:snake[0].x, y:snake[0].y};
      if(inputQueue.length) dir = inputQueue.shift();   // consume one queued turn per tick
      const head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
      if(head.x<0||head.y<0||head.x>=COLS||head.y>=ROWS){ gameOver(); return; }
      for(let i=0;i<snake.length-1;i++){ if(snake[i].x===head.x&&snake[i].y===head.y){ gameOver(); return; } }

      snake.unshift(head);
      if(food && head.x===food.x && head.y===food.y){
        score+=10; eaten++; interval=Math.max(MIN_INTERVAL, BASE_INTERVAL - eaten*STEP); speedMult=(BASE_INTERVAL/interval).toFixed(1);
        flash=1; spawnBurst(head); sfx.eat(); placeFood(); updateStats(true);
      } else snake.pop();
    }

    function gameOver(){ running=false; over=true; sfx.die(); if(score>best){ best=score; try{localStorage.setItem('snake.best',best);}catch(e){} } elBest.textContent=best; showOverlay('over'); }

    function spawnBurst(c){ const cx=(c.x+.5)*cell, cy=(c.y+.5)*cell;
      for(let i=0;i<16;i++){ const a=Math.random()*Math.PI*2, sp=.8+Math.random()*2.4;
        particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:.02+Math.random()*.02,size:cell*(.12+Math.random()*.16)}); } }
    function updateParticles(){ for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vx*=.94; p.vy*=.94; p.life-=p.decay; if(p.life<=0) particles.splice(i,1); } }

    // ---- drawing ----
    function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

    function draw(){
      if(!ctx) return;
      ctx.clearRect(0,0,boardSize,boardSize);
      for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){ if((x+y)%2===0){ ctx.fillStyle='rgba(94,240,168,.035)'; ctx.fillRect(x*cell,y*cell,cell,cell); } }

      if(food && food.x>=0){
        const fx=(food.x+.5)*cell, fy=(food.y+.5)*cell;
        const pulse=1+Math.sin(foodPulse*.12)*.09;
        ctx.save();
        ctx.shadowColor='rgba(255,125,92,.8)'; ctx.shadowBlur=cell*.7;
        ctx.fillStyle='#ff7d5c'; ctx.beginPath(); ctx.arc(fx,fy+cell*.04,cell*.32*pulse,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0; ctx.fillStyle='rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(fx-cell*.1,fy-cell*.06,cell*.08,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#7a4a2e'; ctx.lineWidth=cell*.05; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(fx,fy-cell*.28); ctx.lineTo(fx+cell*.06,fy-cell*.46); ctx.stroke();
        ctx.restore();
      }

      const n=snake.length;
      for(let i=n-1;i>=0;i--){
        const c=snake[i], t=i/n, p=cell*(.08+t*.13), g=.95 - t*.45;
        roundRect(c.x*cell+p,c.y*cell+p,cell-2*p,cell-2*p,cell*(.28-t*.06));
        ctx.fillStyle=`rgb(${Math.round(94*g)},${Math.round(240*g)},${Math.round(168*g)})`; ctx.fill();
      }

      const h=snake[0], hx=h.x*cell, hy=h.y*cell;
      ctx.save();
      ctx.shadowColor='rgba(94,240,168,.7)'; ctx.shadowBlur=cell*.5;
      roundRect(hx+cell*.08,hy+cell*.08,cell*.84,cell*.84,cell*.3); ctx.fillStyle='#c7ffe4'; ctx.fill();
      ctx.restore();
      const ex=hx+cell/2, ey=hy+cell/2, off=cell*.16; let rx,ry;
      if(dir.x!==0){ rx=dir.x*off; ry=0; } else { rx=0; ry=dir.y*off; }
      const perp = dir.x!==0 ? [0,off] : [off,0];
      ctx.fillStyle='#06231c';
      [[-perp[0],-perp[1]],[perp[0],perp[1]]].forEach(o=>{ ctx.beginPath(); ctx.arc(ex+rx+o[0],ey+ry+o[1],cell*.09,0,Math.PI*2); ctx.fill(); });

      for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle='#ffd27d'; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); ctx.fill(); }
      ctx.globalAlpha=1;

      if(flash>0 && prevHead){ const cx=(prevHead.x+.5)*cell, cy=(prevHead.y+.5)*cell;
        ctx.strokeStyle=`rgba(255,210,125,${flash*.9})`; ctx.lineWidth=cell*.14*flash+1;
        ctx.beginPath(); ctx.arc(cx,cy,cell*(.5+(1-flash)*1.6),0,Math.PI*2); ctx.stroke(); }
    }

    function frame(t){
      requestAnimationFrame(frame);
      foodPulse++; updateParticles(); if(flash>0) flash=Math.max(0,flash-.045);
      if(running && !paused){ while(t-lastStep>=interval){ lastStep+=interval; step(); if(!running) break; } }
      draw();
    }

    // ---- UI ----
    function updateStats(bumpScore){ elScore.textContent=score; elBest.textContent=best; elSpeed.textContent=speedMult+'×';
      if(bumpScore){ const s=elScore.closest('.stat'); s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); } }

    function showOverlay(type){
      overlay.classList.remove('hidden');
      if(type==='start')
        overlay.innerHTML=`<div class="ov-inner"><span class="ov-kicker">arcade terminal</span>
          <h2 class="ov-title">SNAKE</h2><p class="ov-sub">Eat the apples, grow the line — and don't bite yourself or kiss a wall.</p>
          <button class="btn btn-primary" id="ovBtn">▶ &nbsp;Start</button>
          <span class="ov-hint">press any arrow key to begin</span></div>`;
      else if(type==='pause')
        overlay.innerHTML=`<div class="ov-inner"><span class="ov-kicker">paused</span><h2 class="ov-title">PAUSED</h2>
          <button class="btn btn-primary" id="ovBtn">Resume</button><span class="ov-hint">press space to continue</span></div>`;
      else if(type==='over')
        overlay.innerHTML=`<div class="ov-inner"><span class="ov-kicker">game over</span><h2 class="ov-title">GAME OVER</h2>
          <p class="ov-score">${score} PTS${score>=best&&score>0?'  · NEW BEST':''}</p>
          <button class="btn btn-primary" id="ovBtn">↻ &nbsp;Play again</button><span class="ov-hint">or press space / enter</span></div>`;
      document.getElementById('ovBtn').addEventListener('click',()=>{ if(type==='pause') resumeGame(); else start(); });
    }
    function hideOverlay(){ overlay.classList.add('hidden'); }

    // ---- input ----
    function setDir(nx,ny){
        const last = inputQueue.length ? inputQueue[inputQueue.length-1] : dir;
        if(nx===last.x && ny===last.y) return;        // same as already-queued move
        if(nx===-last.x && ny===-last.y) return;      // would reverse into yourself
        if(inputQueue.length < 2) inputQueue.push({x:nx,y:ny});
    }


    const KEYMAP={ ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0] };
    window.addEventListener('keydown',e=>{
      if(e.code==='Space'){ e.preventDefault(); if(!started||over) start(); else paused?resumeGame():pauseGame(); return; }
      if(e.code==='Enter' && over){ start(); return; }
      const d=KEYMAP[e.code]; if(d){ e.preventDefault(); ensureAudio();
        if(!started||over) start();
        setDir(d[0],d[1]); }
    });

    let ts=null;
    canvas.addEventListener('touchstart',e=>{ const t=e.touches[0]; ts={x:t.clientX,y:t.clientY}; ensureAudio(); if(!started||over) start(); },{passive:true});
    canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
    canvas.addEventListener('touchend',e=>{ if(!ts) return; const t=e.changedTouches[0];
      const dx=t.clientX-ts.x, dy=t.clientY-ts.y; ts=null;
      if(Math.max(Math.abs(dx),Math.abs(dy))<24) return;
      if(Math.abs(dx)>Math.abs(dy)) setDir(Math.sign(dx),0); else setDir(0,Math.sign(dy)); });

    dpad.querySelectorAll('.dbtn').forEach(b=>b.addEventListener('pointerdown',e=>{ e.preventDefault(); ensureAudio();
      const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.dir]; if(!started||over) start(); setDir(m[0],m[1]); }));

    muteBtn.addEventListener('click',()=>{ muted=!muted; muteBtn.textContent=muted?'🔇':'🔊'; });
    document.addEventListener('visibilitychange',()=>{ if(document.hidden && running && !paused) pauseGame(); });

    // ---- boot (order matters: size → state → UI → loop) ----
    try { best = parseInt(localStorage.getItem('snake.best')||'0',10)||0; } catch(e){ best=0; }
    resize();
    reset();          // defines food + snake before any draw
    updateStats();
    showOverlay('start');
    requestAnimationFrame(frame);

  } catch (err) { fail(err && err.message ? err.message : String(err)); }
})();
</script>
</body>
</html>
